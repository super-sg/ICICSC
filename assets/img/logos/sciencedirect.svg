  </g>
  <!-- ScienceDirect Wordmark -->
  <text x="68" y="38" font-family="'Helvetica Neue', Arial, sans-serif" font-size="22" font-weight="700" letter-spacing="-0.02em" fill="#1b1e2a">Science<tspan fill="#EB640A">Direct</tspan></text>
  <text x="69" y="50" font-family="'Helvetica Neue', Arial, sans-serif" font-size="8.5" font-weight="600" letter-spacing="0.12em" fill="#6b7280" text-transform="uppercase">An Elsevier Journal</text>
